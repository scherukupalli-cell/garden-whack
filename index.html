<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Whack</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #cfe8f3;
    --grass: #6fa83b;
    --soil: #5a3a22;
    --hole: #2e1d10;
    --mole: #8a6248;
    --ink: #24301a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    background: linear-gradient(var(--sky) 0 30%, var(--grass) 30%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 8px; }
  .stats { display: flex; gap: 24px; font-size: 1.25rem; margin-bottom: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: min(420px, 100%);
  }
  .hole {
    aspect-ratio: 1;
    border: none;
    border-radius: 50%;
    background: radial-gradient(var(--hole) 55%, var(--soil) 56%);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    padding: 0;
  }
  .hole:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
  .mole {
    position: absolute;
    left: 20%; width: 60%; height: 70%;
    bottom: -75%;
    background: var(--mole);
    border-radius: 50% 50% 20% 20%;
    transition: bottom 0.12s ease-out;
  }
  .mole::before, .mole::after {
    content: ""; position: absolute; top: 28%;
    width: 12%; height: 12%; background: var(--hole); border-radius: 50%;
  }
  .mole::before { left: 28%; }
  .mole::after { right: 28%; }
  .hole.up .mole { bottom: 5%; }
  .hole.hit .mole { background: #c9a27e; }
  #start {
    margin-top: 24px;
    font: inherit; font-size: 1.25rem;
    padding: 12px 28px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: #ffe27a;
    cursor: pointer;
  }
  #start:disabled { opacity: 0.5; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .mole { transition: none; } }
</style>
</head>
<body>
  <h1>Garden Whack</h1>
  <div class="stats">
    <span>Score: <b id="score">0</b></span>
    <span>Time: <b id="time">30</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <div class="grid" id="grid"></div>
  <button id="start">Start game</button>

<script>
  const GAME_SECONDS = 30;
  const grid = document.getElementById("grid");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const startBtn = document.getElementById("start");

  let score = 0, timeLeft = GAME_SECONDS, playing = false, current = -1;
  let popTimer, clockTimer;

  let best = 0;
  try { best = Number(localStorage.getItem("gardenWhackBest")) || 0; } catch (e) {}
  bestEl.textContent = best;

  const holes = Array.from({ length: 9 }, (_, i) => {
    const btn = document.createElement("button");
    btn.className = "hole";
    btn.setAttribute("aria-label", "Hole " + (i + 1));
    btn.innerHTML = '<div class="mole"></div>';
    btn.addEventListener("click", () => whack(i));
    grid.appendChild(btn);
    return btn;
  });

  function popMole() {
    holes.forEach(h => h.classList.remove("up", "hit"));
    let next;
    do { next = Math.floor(Math.random() * 9); } while (next === current);
    current = next;
    holes[current].classList.add("up");
    const speed = Math.max(450, 1000 - score * 25);
    popTimer = setTimeout(popMole, speed);
  }

  function whack(i) {
    if (!playing || i !== current || holes[i].classList.contains("hit")) return;
    holes[i].classList.add("hit");
    score++;
    scoreEl.textContent = score;
  }

  function startGame() {
    score = 0; timeLeft = GAME_SECONDS; playing = true;
    scoreEl.textContent = 0; timeEl.textContent = timeLeft;
    startBtn.disabled = true;
    popMole();
    clockTimer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    playing = false;
    clearTimeout(popTimer); clearInterval(clockTimer);
    holes.forEach(h => h.classList.remove("up", "hit"));
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("gardenWhackBest", best); } catch (e) {}
    }
    startBtn.textContent = "Play again";
    startBtn.disabled = false;
  }

  startBtn.addEventListener("click", startGame);
</script>
</body>
</html>
